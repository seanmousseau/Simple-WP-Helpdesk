name: PHP Tests

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP ${{ matrix.php }} — lint, PHPCS, PHPStan, PHPUnit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
      fail-fast: false

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # 2.37.1
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57  # v4.2.0
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: PHP Lint
        run: make lint

      - name: PHPCS
        run: make phpcs

      - name: PHPStan
        run: make phpstan

      - name: PHPUnit
        run: make phpunit

  openapi:
    name: OpenAPI — lint + YAML/JSON sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38  # v5.4.0
        with:
          python-version: '3.12'

      - name: Install PyYAML (for sync script)
        run: pip install --quiet pyyaml

      - name: Regenerate docs/openapi.json from YAML
        run: bash bin/openapi-sync.sh

      - name: Fail if openapi.json drifted from docs/openapi.yaml
        run: |
          if ! git diff --exit-code -- docs/openapi.json docs/openapi.yaml simple-wp-helpdesk/openapi.json; then
            echo "::error::openapi.json (docs/ and/or simple-wp-helpdesk/) is out of sync with docs/openapi.yaml."
            echo "Run 'bash bin/openapi-sync.sh' locally and commit the result."
            exit 1
          fi

      - name: Fail if docs/openapi.json and plugin-bundled openapi.json differ
        run: |
          if ! diff -q docs/openapi.json simple-wp-helpdesk/openapi.json >/dev/null; then
            echo "::error::docs/openapi.json and simple-wp-helpdesk/openapi.json must be identical."
            echo "Run 'bash bin/openapi-sync.sh' locally and commit both files."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Lint OpenAPI spec (Redocly)
        run: npx --yes @redocly/cli@latest lint docs/openapi.yaml --format=stylish

  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # 2.37.1
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Security audit (production deps only)
        # `--locked` audits the composer.lock directly. Without it, Composer
        # 2.7+ refuses to filter the installed package set down to prod-only
        # when dev packages are present (and they always are here — the test
        # job step above installs them). `--no-dev --locked` together asks
        # Composer to audit only the require (not require-dev) packages from
        # the lockfile, which is the semantic we want for this job.
        run: composer audit --no-dev --locked

  changelog-check:
    name: CHANGELOG Updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was modified
        env:
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # All inputs read via env vars (PR_LABELS / BASE_SHA / HEAD_SHA),
          # double-quoted in shell — safe from workflow injection.

          # Label-based escape hatch.
          if echo "$PR_LABELS" | grep -qE '"dx"|"documentation"'; then
            echo "Skipping changelog check for dx/documentation PR (label)."
            exit 0
          fi

          # Auto-skip when the diff only touches non-shipping paths (docs, repo
          # metadata, GitHub config, dev tooling). These can't change user-visible
          # behavior so they don't need a changelog entry. Path-based detection
          # works even on PRs that didn't get manually labeled.
          changed_files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          code_files=$(echo "$changed_files" | grep -vE '^(docs/|\.github/|CLAUDE\.md|README\.md|CONTRIBUTING\.md|SECURITY\.md|LICENSE|\.gitignore|\.editorconfig|\.gitattributes|\.githooks/)' || true)
          if [ -z "$code_files" ]; then
            echo "Skipping changelog check — diff only touches non-shipping paths."
            echo "Changed files:"
            echo "$changed_files" | sed 's/^/  - /'
            exit 0
          fi

          if ! echo "$changed_files" | grep -q '^CHANGELOG\.md$'; then
            echo "::error::CHANGELOG.md was not updated in this PR."
            echo "Add an entry under the appropriate version heading before merging."
            echo "If this PR truly has no user-visible effect, add the 'dx' or 'documentation' label."
            exit 1
          fi

  matrix-lint:
    # PR 6 of the testing overhaul: fails if any feature row in the test-coverage
    # matrix regressed (a cell went from ✓ / P / N/A to R) without an explicit
    # rationale in the PR. See docs/internal/test-coverage-matrix.md.
    name: Test Coverage Matrix — no regression
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc  # 2.37.1
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Fetch base ref (validated against repo-controlled allowlist)
        env:
          # github.event.pull_request.base.ref is the PR's TARGET branch — it's
          # repo-controlled, not attacker-controlled (a PR can only target an
          # existing branch in this repo). But for defense-in-depth we still
          # validate against a known-safe pattern before using it as a shell arg.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Refuse anything other than a-z 0-9 _ - / . — git branch names can
          # contain those legitimately; metacharacters cannot.
          if ! echo "$BASE_REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Refusing to use base ref containing metacharacters: $BASE_REF"
            exit 2
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Lint matrix structure (catches malformed cells)
        run: php bin/matrix-lint.php

      - name: Diff matrix vs PR base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if ! echo "$BASE_REF" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Refusing to use base ref containing metacharacters."
            exit 2
          fi
          BASE="origin/$BASE_REF"
          if ! git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            echo "::error::Could not resolve $BASE — fetch step may have failed."
            exit 2
          fi
          if ! git show "$BASE:docs/internal/test-coverage-matrix.md" > /tmp/swh-matrix-base.md 2>/dev/null; then
            echo "::warning::Base ref $BASE has no matrix file — skipping diff (treat as new-repo case)."
            exit 0
          fi
          php bin/matrix-lint.php --diff
