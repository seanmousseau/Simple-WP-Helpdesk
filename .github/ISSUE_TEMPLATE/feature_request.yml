name: Feature request
description: Suggest a new feature or enhancement.
title: "[Feature] "
labels:
  - enhancement
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Before submitting, please skim the [roadmap](https://github.com/seanmousseau/Simple-WP-Helpdesk/blob/main/docs/internal/roadmap.md) and [parked features](https://github.com/seanmousseau/Simple-WP-Helpdesk/blob/main/docs/internal/parked_features.md) to see if your idea already has a home.

        Simple WP Helpdesk's identity is: **native WordPress, lightweight, no third-party services required, no custom DB tables, secure by default, accessible, fully i18n**. Features that conflict with that identity are unlikely to land.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Describe the situation in your own words.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen? Be specific about behavior, not implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds have you tried? What other approaches did you consider?

  - type: dropdown
    id: scope
    attributes:
      label: Where does this live?
      multiple: true
      options:
        - Admin (ticket list / editor / settings)
        - Client portal / frontend
        - Email
        - REST / AJAX / inbound webhook
        - Reports / analytics
        - CLI / automation
        - Other (explain in proposal)

  - type: dropdown
    id: priority
    attributes:
      label: How urgent is this for you?
      options:
        - Nice to have
        - Would meaningfully improve my workflow
        - Blocking my use of the plugin

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I've checked the roadmap and parked features docs.
          required: true
        - label: This fits the plugin's identity (native WP, lightweight, secure, accessible, i18n).
          required: false
